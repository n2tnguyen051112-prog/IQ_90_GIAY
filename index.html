<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:#141132;font-synthesis:none;--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.095);--yellow:#ffe56f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(ellipse at 12% 4%,#9c38a9 0,transparent 37%),radial-gradient(ellipse at 100% 90%,#3856b8 0,transparent 48%),linear-gradient(135deg,#18113e,#25205c 65%,#15143a)}button{font:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #fff;outline-offset:2px}.app{height:100vh;height:100dvh;width:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;position:relative;border-left:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08)}.hidden{display:none!important}
.header{flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 11px) 14px 12px;background:rgba(16,13,51,.76);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);z-index:2}.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-size:clamp(16px,4.6vw,21px);font-weight:900;letter-spacing:-.5px;white-space:nowrap}.logo b{color:var(--yellow)}.audio-toggle{flex:none;width:35px;height:35px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);border-radius:11px;background:rgba(255,255,255,.13);color:#fff;cursor:pointer;font-size:17px}.audio-toggle[aria-pressed="false"]{opacity:.65}.tag{font-size:11px;font-weight:800;padding:7px 10px;border:1px solid rgba(255,229,111,.45);border-radius:999px;background:rgba(255,229,111,.12);white-space:nowrap}.stats{margin-top:11px;display:flex;gap:8px}.stat{min-width:0;flex:1;border:1px solid var(--line);border-radius:13px;padding:8px 7px;text-align:center;background:var(--glass)}.stat small{display:block;color:#e0dcfc;font-size:10px;line-height:1.2}.stat strong{display:block;margin-top:3px;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1}.timer.warning strong{color:#ffcd63}.timer.danger strong{color:#ff849e;animation:pulse .8s infinite}.meter{height:6px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-top:10px}.meter>div{width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,#60e4f4,#aa8aff,#ff90cc);transition:width .2s}@keyframes pulse{50%{opacity:.58}}
.main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 14px 24px;scrollbar-width:thin;scrollbar-color:#aaa4d5 transparent}.panel{border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.09);box-shadow:0 15px 35px rgba(0,0,0,.15);padding:19px 16px}.eyebrow{font-size:12px;letter-spacing:1.2px;font-weight:850;color:#ffe56f}.question{font-weight:850;font-size:clamp(19px,5.2vw,25px);line-height:1.35;overflow-wrap:anywhere;margin:12px 0 20px}.choices{display:grid;gap:10px}.choice{width:100%;display:flex;align-items:center;text-align:left;gap:11px;padding:12px;min-height:58px;border:1px solid rgba(255,255,255,.19);border-radius:15px;background:rgba(255,255,255,.12);color:#fff;font-size:15px;font-weight:650;line-height:1.35;cursor:pointer;overflow-wrap:anywhere}.choice .letter{flex:none;width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#ffe56f;font-weight:900}.choice.selected{background:rgba(255,229,111,.17);border:2px solid #ffe56f;padding:11px}.note{color:#dad5f4;font-size:12px;line-height:1.55;text-align:center;margin:16px 1px 0}
.footer{flex:0 0 auto;display:flex;gap:10px;padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);background:rgba(14,12,45,.94);z-index:2}.btn{min-width:0;min-height:49px;border:0;border-radius:14px;padding:10px 12px;font-weight:850;font-size:14px;cursor:pointer}.btn-primary{flex:1;background:linear-gradient(110deg,#ffe878,#ffac56);color:#2b1744;box-shadow:0 8px 20px rgba(255,162,76,.2)}.btn-quiet{flex:0 0 auto;background:rgba(255,255,255,.13);color:#fff;border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}
.center{text-align:center}.hero-icon{font-size:60px;line-height:1.2;margin:13px 0}.hero-title{font-weight:950;font-size:clamp(28px,7.5vw,42px);line-height:1.07;margin:10px auto;letter-spacing:-1.2px}.gradient{background:linear-gradient(90deg,#ffe56f,#ff92cc,#7fe7ff);color:transparent;background-clip:text;-webkit-background-clip:text}.lead{font-size:16px;color:#ebe6ff;line-height:1.55}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:20px 0}.chip{padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--line);font-size:12px;font-weight:750}.score{display:inline-grid;place-items:center;width:160px;height:160px;border-radius:50%;background:conic-gradient(#ffe56f,#ff83c5,#76dffc,#ffe56f);margin:12px auto 8px;padding:11px}.score-inner{display:grid;place-content:center;width:100%;height:100%;background:#211b51;border-radius:50%}.score-number{font-size:42px;font-weight:950;line-height:1}.score-label{font-size:12px;margin-top:7px}.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:14px 0}.result-grid .stat{padding:12px 3px}.result-grid .stat strong{font-size:21px}.comment{border-left:4px solid #ffe56f;background:rgba(255,255,255,.1);border-radius:14px;padding:14px;line-height:1.55;text-align:left;font-size:15px}.share-preview{white-space:pre-wrap;font-size:13px;line-height:1.6;color:#e9e5ff;text-align:left;border:1px dashed var(--line);padding:12px;border-radius:12px;margin:16px 0 0;overflow-wrap:anywhere}
@media(max-width:350px){.header{padding-left:10px;padding-right:10px}.main{padding:12px 10px 18px}.footer{padding-left:10px;padding-right:10px}.panel{padding:14px 12px}.question{font-size:18px}.choice{min-height:50px;padding:9px;font-size:14px}.choice.selected{padding:8px}.logo{font-size:16px}.audio-toggle{width:31px;height:31px}.tag{font-size:9px;padding:6px 7px}.btn{font-size:12px}.stat strong{font-size:17px}}
@media(max-height:620px){.header{padding-top:calc(env(safe-area-inset-top) + 7px);padding-bottom:8px}.stats{margin-top:7px}.stat{padding:6px 4px}.meter{margin-top:7px}.main{padding-top:11px}.footer{padding-top:8px}.btn{min-height:44px}.panel{padding-top:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* Giao diện tập trung, luôn vừa chiều ngang điện thoại */
.brand{min-width:0}.logo{font-size:clamp(14px,3.7vw,19px);letter-spacing:-.35px;white-space:normal;line-height:1.2;min-width:0}.audio-toggle{margin-left:auto}
.header{padding-top:calc(env(safe-area-inset-top) + 10px);padding-bottom:9px}

.hero-icon{font-size:50px;margin:12px 0 5px}.hero-title{font-size:clamp(26px,7vw,36px);margin:8px 0}.lead{margin:14px 0 8px}
.question{margin:10px 0 14px}.choices{gap:9px}.choice{min-height:53px}
.result-grid{margin:12px 0}.score{width:145px;height:145px}.score-number{font-size:38px}
.footer{padding-top:9px}.btn{min-height:47px}.share-preview.hidden{display:none!important}
@media(max-height:620px){.hero-icon{font-size:40px}.hero-title{font-size:27px}.question{font-size:18px;margin:8px 0 12px}.choice{min-height:47px}.panel{padding:13px 12px}}

<body>
<div class="app">
<header class="header">
 <div class="brand"><div class="logo">🧠 <b>THỬ THÁCH IQ – 90 GIÂY!</b></div><button id="soundBtn" class="audio-toggle" type="button" aria-label="Tắt âm thanh" aria-pressed="true" title="Bật/tắt nhạc">🔊</button></div>
 <div id="gameStats" class="stats hidden"><div class="stat"><small>CÂU HỎI</small><strong id="position">1/10</strong></div><div class="stat timer" id="timerBox"><small>CÒN LẠI</small><strong id="timer">90s</strong></div></div>
 <div id="progressWrap" class="meter hidden"><div id="progress"></div></div>
</header>
<main id="scrollArea" class="main">
 <section id="welcome" class="panel center"><div class="hero-icon">🧠⚡</div><h1 class="hero-title">10 CÂU HỎI<br><span class="gradient">90 GIÂY</span></h1><p class="lead">Bạn vượt qua được bao nhiêu câu?</p><p class="note">Chỉ công bố tổng điểm khi kết thúc.</p></section>
 <section id="quiz" class="panel hidden"><div id="questionNumber" class="eyebrow">CÂU 1 / 10</div><div id="questionText" class="question"></div><div id="choices" class="choices"></div></section>
 <section id="result" class="panel hidden center"><h1 class="hero-title">🏆 KẾT QUẢ</h1><div class="score"><div class="score-inner"><div class="score-number" id="score">0/10</div><div class="score-label">CÂU ĐÚNG</div></div></div><div class="result-grid"><div class="stat"><small>ĐÚNG</small><strong id="correct">0</strong></div><div class="stat"><small>ĐÃ TRẢ LỜI</small><strong id="attempted">0</strong></div><div class="stat"><small>CHƯA TRẢ LỜI</small><strong id="skipped">0</strong></div></div><div id="comment" class="comment"></div><div id="sharePreview" class="share-preview hidden" aria-hidden="true"></div></section>
</main>
<footer id="actions" class="footer"><button id="startBtn" class="btn btn-primary">▶ BẮT ĐẦU</button><button id="skipBtn" class="btn btn-quiet hidden">BỎ QUA →</button><button id="submitBtn" class="btn btn-primary hidden">KẾT THÚC</button><button id="copyBtn" class="btn btn-primary hidden">📋 SAO CHÉP KẾT QUẢ</button><button id="againBtn" class="btn btn-quiet hidden">↻ Chơi lại</button></footer>
</div>
<script>
(()=>{'use strict';
const questions=[
{q:'Số tiếp theo trong dãy: 2, 4, 8, 16, …?',o:['18','24','32','30'],a:2},
{q:'Tìm số còn thiếu: 3, 6, 11, 18, 27, …?',o:['36','38','40','42'],a:1},
{q:'Nếu tất cả hoa hồng đều là hoa, kết luận nào chắc chắn đúng?',o:['Hoa hồng không phải là hoa','Mọi hoa đều là hoa hồng','Hoa hồng là hoa','Không có hoa hồng nào màu đỏ'],a:2},
{q:'Đồng hồ chỉ đúng 3 giờ. Góc nhỏ hơn giữa kim giờ và kim phút bằng bao nhiêu?',o:['60°','75°','90°','120°'],a:2},
{q:'Đâu là từ khác nhóm nhất?',o:['Cam','Táo','Cà rốt','Xoài'],a:2},
{q:'Nếu 5 con mèo bắt 5 con chuột trong 5 phút, với năng suất như nhau, một con mèo bắt một con chuột mất bao lâu?',o:['1 phút','5 phút','10 phút','25 phút'],a:1},
{q:'Chữ cái tiếp theo trong dãy A, C, F, J, … là gì? (Theo bảng chữ cái tiếng Anh)',o:['L','M','N','O'],a:3},
{q:'Có 3 chiếc áo khác nhau và 2 chiếc quần khác nhau. Có bao nhiêu cách phối một áo với một quần?',o:['5','6','8','9'],a:1},
{q:'Nếu hôm kia là thứ Hai thì ngày kia là thứ mấy?',o:['Thứ Tư','Thứ Năm','Thứ Sáu','Chủ Nhật'],a:2},
{q:'Số nào không thuộc nhóm lập phương của số nguyên dương? 8, 27, 64, 81, 125',o:['27','64','81','125'],a:2}
];
const el=id=>document.getElementById(id);
const buttonIds=['startBtn','skipBtn','submitBtn','copyBtn','againBtn'];
let state='welcome',answers=[],index=0,deadline=0,interval=null,locked=false,finishedTime=0;
// Âm nhạc tổng hợp trực tiếp, giai điệu gốc, không dùng MP3 bên ngoài.
const AudioEngine=(()=>{
  let context=null,enabled=true,loop=null,step=0,activeVoices=new Set();
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  const frequencies={C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196,A3:220,B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,G5:783.99};
  function init(){if(!enabled||!AudioCtx)return false;try{if(!context)context=new AudioCtx();if(context.state==='suspended')context.resume().catch(()=>{});return true}catch(_){return false}}
  function note(pitch,when,duration=.18,volume=.045,wave='sine'){
    if(!enabled||!context||context.state==='closed')return;
    let osc,gain;try{
      osc=context.createOscillator();gain=context.createGain();osc.type=wave;osc.frequency.value=typeof pitch==='number'?pitch:frequencies[pitch];
      gain.gain.setValueAtTime(0,when);gain.gain.linearRampToValueAtTime(volume,when+.018);
      gain.gain.exponentialRampToValueAtTime(.0001,when+duration);
      osc.connect(gain);gain.connect(context.destination);osc.start(when);osc.stop(when+duration+.03);
      activeVoices.add(osc);osc.onended=()=>{activeVoices.delete(osc);try{osc.disconnect();gain.disconnect()}catch(_){}};
    }catch(_){try{osc?.disconnect();gain?.disconnect()}catch(__){}}
  }
  function silence(){if(loop){clearInterval(loop);loop=null}for(const voice of activeVoices){try{voice.stop()}catch(_){}}activeVoices.clear()}
  const tune=['C4','E4','G4','E4','D4','F4','A4','F4','E4','G4','B4','G4','D4','F4','A4','G4'];
  const bass=['C3','F3','E3','G3'];
  function backgroundTick(){if(!enabled||!context||state!=='quiz')return;const t=context.currentTime+.025;note(tune[step%tune.length],t,.19,.026,'triangle');if(step%4===0)note(bass[Math.floor(step/4)%bass.length],t,.48,.018,'sine');step++}
  function startMusic(){silence();if(!init())return;step=0;backgroundTick();loop=setInterval(backgroundTick,285)}
  function fanfare(high){silence();if(!init())return;const t=context.currentTime+.06;
    const melody=high?['C5','E5','G5','E5','G5','C5','E5','G5']:['E4','D4','C4','B3','A3','G3'];
    melody.forEach((n,i)=>note(n,t+i*(high?.16:.27),high?.26:.39,high?.075:.055,high?'triangle':'sine'));
    if(high){note('C4',t,.55,.035,'sine');note('G4',t+.64,.8,.035,'sine')}
  }
  function setEnabled(value){enabled=value;const b=el('soundBtn');b.textContent=enabled?'🔊':'🔇';b.setAttribute('aria-pressed',String(enabled));b.setAttribute('aria-label',enabled?'Tắt âm thanh':'Bật âm thanh');if(!enabled)silence();else if(state==='quiz')startMusic();else if(state==='result')fanfare(Number(el('correct').textContent)>=7)}
  function toggle(){setEnabled(!enabled)}
  function stop(){silence()}
  return {startMusic,fanfare,stop,toggle};
})();
function showButtons(...ids){buttonIds.forEach(id=>el(id).classList.toggle('hidden',!ids.includes(id)))}
function screen(name){state=name;['welcome','quiz','result'].forEach(id=>el(id).classList.toggle('hidden',id!==name));el('gameStats').classList.toggle('hidden',name!=='quiz');el('progressWrap').classList.toggle('hidden',name!=='quiz');el('scrollArea').scrollTop=0}
function count(){return answers.filter(x=>x!==null).length}
function clock(){if(state!=='quiz')return;const remaining=Math.max(0,Math.ceil((deadline-performance.now())/1000));el('timer').textContent=remaining+'s';el('timerBox').classList.toggle('warning',remaining<=30&&remaining>10);el('timerBox').classList.toggle('danger',remaining<=10);if(remaining===0)finish()}
function start(){AudioEngine.stop();if(interval)clearInterval(interval);answers=Array(10).fill(null);index=0;locked=false;deadline=performance.now()+90000;finishedTime=0;screen('quiz');showButtons('skipBtn','submitBtn');render();clock();AudioEngine.startMusic();interval=setInterval(clock,200)}
function render(){if(state!=='quiz')return;if(index>=questions.length){finish();return}const q=questions[index];el('position').textContent=(index+1)+'/10';el('progress').style.width=((index+1)*10)+'%';el('questionNumber').textContent='CÂU '+(index+1)+' / 10';el('questionText').textContent=q.q;const root=el('choices');root.replaceChildren();q.o.forEach((label,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='choice';const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i];const content=document.createElement('span');content.textContent=label;btn.append(letter,content);btn.addEventListener('click',()=>choose(i,btn));root.append(btn)});el('scrollArea').scrollTop=0}
function choose(i,btn){if(state!=='quiz'||locked||performance.now()>=deadline){clock();return}locked=true;answers[index]=i;btn.classList.add('selected');// Ngăn bấm liên tiếp trong thời gian chuyển câu
setTimeout(()=>{if(state!=='quiz')return;if(performance.now()>=deadline){finish();return}index++;locked=false;render()},180)}
function skip(){if(state!=='quiz'||locked)return;if(performance.now()>=deadline){finish();return}index++;render()}
function funny(score,attempted){if(!attempted)return'🧘 Bạn đạt cảnh giới tĩnh tâm tuyệt đối: 90 giây không chọn câu nào. Não đang nghỉ dưỡng có phép!';if(score<=2)return'🔋 Não hôm nay bật chế độ tiết kiệm pin. Thử lại biết đâu thiên tài vừa hết giờ nghỉ trưa! 😆';if(score<=4)return'😄 Bạn có tố chất thiên tài… nhưng hình như Wi-Fi giữa não và ngón tay hơi yếu!';if(score<=6)return'🔥 Tư duy khá ổn! Chỉ cần thêm chút turbo là não chạy mượt như điện thoại mới.';if(score<=8)return'😎 Não xử lý nhanh đấy! Bạn thuộc hệ nhìn quy luật trước khi người khác kịp đọc đề.';if(score===9)return'🤯 Sát nút 10/10! Có lẽ bộ não của bạn chỉ cố tình chừa một câu cho mọi người đỡ áp lực.';return'👑 10/10! Trùm cuối xuất hiện. Máy tính cũng muốn xin bạn bí kíp khởi động não!'}
function finish(){if(state!=='quiz')return;clearInterval(interval);interval=null;finishedTime=Math.max(0,Math.min(90,Math.round(90-(deadline-performance.now())/1000)));let score=questions.reduce((sum,q,i)=>sum+(answers[i]===q.a?1:0),0),attempted=count();el('score').textContent=score+'/10';el('correct').textContent=score;el('attempted').textContent=attempted;el('skipped').textContent=10-attempted;el('comment').textContent=funny(score,attempted);const msg=`🧠 THỬ THÁCH IQ – 90 GIÂY!\n✅ ${score}/${attempted} câu trả lời đúng (${10} câu trong game)\n⏱ Giới hạn 90 giây\n😎 ${funny(score,attempted)}\nBạn có dám vượt điểm của tôi không?\n🎮 ${location.href.split('#')[0]}`;el('sharePreview').textContent=msg;screen('result');showButtons('copyBtn','againBtn');AudioEngine.fanfare(score>=7)}
async function copy(){const text=el('sharePreview').textContent;try{await navigator.clipboard.writeText(text);el('copyBtn').textContent='✅ ĐÃ SAO CHÉP';setTimeout(()=>el('copyBtn').textContent='📋 SAO CHÉP KẾT QUẢ',2000)}catch(_){const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}area.remove();el('copyBtn').textContent=ok?'✅ ĐÃ SAO CHÉP':'HÃY CHỤP MÀN HÌNH';setTimeout(()=>el('copyBtn').textContent='📋 SAO CHÉP KẾT QUẢ',2500)}}
el('soundBtn').addEventListener('click',AudioEngine.toggle);el('startBtn').addEventListener('click',start);el('skipBtn').addEventListener('click',skip);el('submitBtn').addEventListener('click',finish);el('copyBtn').addEventListener('click',copy);el('againBtn').addEventListener('click',start);
})();
</script>
